[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ffpfsc-converter"
dynamic = ["version"]
description = "Interfaz gráfica para convertir juegos de PS5 (carpeta, .exfat o .ffpkg) a .ffpfsc con MkPFS"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Victor Zepeda" }]
dependencies = [
    "mkpfs>=1.1",
    "zlib-ng>=0.5",
    "tkinterdnd2>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
ffpfsc-converter = "ffpfsc_converter.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "ffpfsc_converter.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "BLE"]
ignore = [
    "RUF001",  # caracteres "ambiguos" (–, ×) son intencionales en textos en español
    "RUF002",
    "RUF003",
]
